trigger:
  branches:
    include:
      - main

# Pull Request:
# PR par Build/Test chalega.
# Docker/Deploy/Verify stages intentionally skip honge.
pr:
  branches:
    include:
      - main


# ============================================================
# GLOBAL VARIABLES
# ============================================================
variables:
  acrLoginServer: 'acrtelecomossbss01.azurecr.io'
  imageTag: '$(Build.BuildId)'

  aksResourceGroup: 'rg-telecom-ossbss-dev'
  aksClusterName: 'aks-telecom-dev'
  kubernetesNamespace: 'telecom'


# ============================================================
# BUILD AGENT
# ============================================================
pool:
  vmImage: 'ubuntu-latest'


# ============================================================
# STAGES
# ============================================================
stages:


# ============================================================
# STAGE 1 - BUILD AND TEST
# ============================================================
- stage: Build
  displayName: 'Build and Test'

  jobs:
  - job: MavenBuild
    displayName: 'Maven Build and Test'

    steps:

    - checkout: self


    # --------------------------------------------------------
    # Java 17
    # --------------------------------------------------------
    - task: JavaToolInstaller@0
      displayName: 'Use Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'


    # --------------------------------------------------------
    # Verify Java and Maven
    # --------------------------------------------------------
    - script: |
        echo "=========================================="
        echo "JAVA VERSION"
        echo "=========================================="
        java -version

        echo "=========================================="
        echo "MAVEN VERSION"
        echo "=========================================="
        mvn -version
      displayName: 'Verify Java and Maven'


    # --------------------------------------------------------
    # Maven Build + Unit Tests
    # --------------------------------------------------------
    - script: |
        echo "=========================================="
        echo "MAVEN BUILD AND TEST"
        echo "=========================================="

        mvn clean test package

      displayName: 'Maven Build and Tests'


# ============================================================
# STAGE 2 - BUILD AND PUSH DOCKER IMAGES
#
# Runs only after successful Build stage.
# Also skipped for Pull Requests.
# ============================================================
- stage: Docker
  displayName: 'Build and Push Docker Images'

  dependsOn:
    - Build

  condition: |
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest')
    )

  jobs:
  - job: DockerBuild
    displayName: 'Build Docker Images'

    steps:

    - checkout: self


    # --------------------------------------------------------
    # Java 17
    # --------------------------------------------------------
    - task: JavaToolInstaller@0
      displayName: 'Use Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'


    # --------------------------------------------------------
    # Build JAR files
    #
    # Docker stage runs on a fresh agent.
    # Therefore target/*.jar from Stage 1 is not available here.
    # Maven must run again.
    # --------------------------------------------------------
    - script: |
        echo "=========================================="
        echo "JAVA VERSION"
        echo "=========================================="
        java -version

        echo "=========================================="
        echo "MAVEN VERSION"
        echo "=========================================="
        mvn -version

        echo "=========================================="
        echo "BUILDING JAR FILES"
        echo "=========================================="

        mvn clean package -DskipTests

      displayName: 'Build JAR Files'


    # --------------------------------------------------------
    # Verify Billing JAR
    # --------------------------------------------------------
    - script: |
        echo "=========================================="
        echo "BILLING SERVICE"
        echo "=========================================="

        ls -lh src/billing-service/target/

        test -f src/billing-service/target/billing-service-1.0.0.jar

      displayName: 'Verify Billing JAR'


    # --------------------------------------------------------
    # Verify CDR JAR
    # --------------------------------------------------------
    - script: |
        echo "=========================================="
        echo "CDR SERVICE"
        echo "=========================================="

        ls -lh src/cdr-service/target/

        test -f src/cdr-service/target/cdr-service-1.0.0.jar

      displayName: 'Verify CDR JAR'


    # --------------------------------------------------------
    # Verify Customer JAR
    # --------------------------------------------------------
    - script: |
        echo "=========================================="
        echo "CUSTOMER SERVICE"
        echo "=========================================="

        ls -lh src/customer-service/target/

        test -f src/customer-service/target/customer-service-1.0.0.jar

      displayName: 'Verify Customer JAR'


    # --------------------------------------------------------
    # Billing Docker Image
    #
    # Only immutable Build.BuildId tag.
    # --------------------------------------------------------
    - task: Docker@2
      displayName: 'Build and Push Billing Image'
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'ACR-Service-Connection'
        repository: 'billing-service'
        Dockerfile: 'src/billing-service/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(imageTag)


    # --------------------------------------------------------
    # CDR Docker Image
    # --------------------------------------------------------
    - task: Docker@2
      displayName: 'Build and Push CDR Image'
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'ACR-Service-Connection'
        repository: 'cdr-service'
        Dockerfile: 'src/cdr-service/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(imageTag)


    # --------------------------------------------------------
    # Customer Docker Image
    # --------------------------------------------------------
    - task: Docker@2
      displayName: 'Build and Push Customer Image'
      inputs:
        command: 'buildAndPush'
        containerRegistry: 'ACR-Service-Connection'
        repository: 'customer-service'
        Dockerfile: 'src/customer-service/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(imageTag)


# ============================================================
# STAGE 3 - DEPLOY TO AKS
#
# Runs only after successful Docker stage.
# Also skipped for Pull Requests.
# ============================================================
- stage: Deploy
  displayName: 'Deploy to AKS'

  dependsOn:
    - Docker

  condition: |
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest')
    )

  jobs:
  - deployment: AKSDeployment
    displayName: 'Deploy Telecom OSS/BSS'

    environment: 'telecom-aks'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self


          # --------------------------------------------------
          # Namespace / ConfigMap / Secret / Billing
          # --------------------------------------------------
          - task: KubernetesManifest@1
            displayName: 'Deploy Billing Service'
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: 'Azure-Service-Connection'
              azureResourceGroup: '$(aksResourceGroup)'
              kubernetesCluster: '$(aksClusterName)'
              namespace: '$(kubernetesNamespace)'

              manifests: |
                k8s/namespace.yaml
                k8s/configmap.yaml
                k8s/secret.yaml
                k8s/billing-deployment.yaml
                k8s/billing-service.yaml

              containers: |
                $(acrLoginServer)/billing-service:$(imageTag)


          # --------------------------------------------------
          # CDR
          # --------------------------------------------------
          - task: KubernetesManifest@1
            displayName: 'Deploy CDR Service'
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: 'Azure-Service-Connection'
              azureResourceGroup: '$(aksResourceGroup)'
              kubernetesCluster: '$(aksClusterName)'
              namespace: '$(kubernetesNamespace)'

              manifests: |
                k8s/cdr-deployment.yaml
                k8s/cdr-service.yaml

              containers: |
                $(acrLoginServer)/cdr-service:$(imageTag)


          # --------------------------------------------------
          # Customer
          # --------------------------------------------------
          - task: KubernetesManifest@1
            displayName: 'Deploy Customer Service'
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: 'Azure-Service-Connection'
              azureResourceGroup: '$(aksResourceGroup)'
              kubernetesCluster: '$(aksClusterName)'
              namespace: '$(kubernetesNamespace)'

              manifests: |
                k8s/customer-deployment.yaml
                k8s/customer-service.yaml

              containers: |
                $(acrLoginServer)/customer-service:$(imageTag)


          # --------------------------------------------------
          # Ingress
          # --------------------------------------------------
          - task: KubernetesManifest@1
            displayName: 'Deploy Ingress'
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: 'Azure-Service-Connection'
              azureResourceGroup: '$(aksResourceGroup)'
              kubernetesCluster: '$(aksClusterName)'
              namespace: '$(kubernetesNamespace)'

              manifests: |
                k8s/ingress.yaml


# ============================================================
# STAGE 4 - VERIFY AKS
#
# Runs only after successful Deploy stage.
# Also skipped for Pull Requests.
# ============================================================
- stage: Verify
  displayName: 'Verify AKS Deployment'

  dependsOn:
    - Deploy

  condition: |
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest')
    )

  jobs:
  - job: VerifyAKS
    displayName: 'Verify AKS Workloads'

    steps:

    - checkout: self


    # --------------------------------------------------------
    # Pods
    # --------------------------------------------------------
    - task: Kubernetes@1
      displayName: 'Check Pods'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'Azure-Service-Connection'
        azureResourceGroup: '$(aksResourceGroup)'
        kubernetesCluster: '$(aksClusterName)'
        command: 'get'
        arguments: 'pods -n $(kubernetesNamespace) -o wide'


    # --------------------------------------------------------
    # Services
    # --------------------------------------------------------
    - task: Kubernetes@1
      displayName: 'Check Services'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'Azure-Service-Connection'
        azureResourceGroup: '$(aksResourceGroup)'
        kubernetesCluster: '$(aksClusterName)'
        command: 'get'
        arguments: 'svc -n $(kubernetesNamespace)'


    # --------------------------------------------------------
    # Ingress
    # --------------------------------------------------------
    - task: Kubernetes@1
      displayName: 'Check Ingress'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'Azure-Service-Connection'
        azureResourceGroup: '$(aksResourceGroup)'
        kubernetesCluster: '$(aksClusterName)'
        command: 'get'
        arguments: 'ingress -n $(kubernetesNamespace)'
